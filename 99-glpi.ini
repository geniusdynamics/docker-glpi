; PHP settings for GLPI (Apache SAPI)
; 128M is the Debian default that was in effect before (the old ini path did not exist)
memory_limit = 128M
file_uploads = on
max_execution_time = 600
session.auto_start = off
session.use_trans_sid = 0
session.cookie_httponly = on
; GLPI does not use PHP upload progress tracking; switching it off removes an
; attack surface that is reachable without authentication.
session.upload_progress.enabled = off
